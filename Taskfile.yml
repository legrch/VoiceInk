version: '3'
tasks:
  dev:
    aliases: [d]
    desc: Build Dev, wait for stable VoiceInk to become idle, test Dev, then reopen stable
    cmds: [scripts/dev.sh run]
  dev:build:
    desc: Build a signed Dev app without launch or installation
    cmds: [scripts/dev.sh build]
  check:
    desc: Run audio, release metadata and automation checks
    cmds:
      - Tools/AudioDuckingTests/run.sh
      - Tools/PlusReleaseTests/run.sh
      - Tools/AutomationTests/run.sh
      - Tools/ReleaseInstallTests/test-bootstrap.sh
  release:
    desc: Request a server-side release of GitHub main without editing local files
    cmds: [python3 scripts/release-tag.py]
  release:dry-run:
    desc: Request a signed packaging dry run without a tag or publication
    cmds: [python3 scripts/release-tag.py --dry-run]
