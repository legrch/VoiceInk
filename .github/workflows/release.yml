name: Release
run-name: Release ${{ github.event_name == 'push' && github.ref_name || inputs.mode }}
on:
  push:
    tags: ['plus-v*']
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run, or explicitly reserve a tag and publish
        type: choice
        options: [dry-run, publish]
        default: dry-run
      expected_source:
        description: Optional exact main SHA supplied by task release
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && format('voiceink-dry-{0}', github.run_id) || 'voiceink-release' }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'legrch/VoiceInk'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      publish: ${{ steps.plan.outputs.publish }}
      source: ${{ steps.plan.outputs.source }}
      tag: ${{ steps.plan.outputs.tag }}
      metadata: ${{ steps.plan.outputs.metadata }}
      reservation: ${{ steps.plan.outputs.reservation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check source defaults
        run: python3 scripts/plus-release.py check
      - name: Plan explicit release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode || 'dry-run' }}
          EXPECTED_SOURCE: ${{ inputs.expected_source }}
        run: python3 scripts/ci/server-release.py plan
  reserve:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      tag_object: ${{ steps.reserve.outputs.tag_object }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve immutable tag
        id: reserve
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEINK_RELEASE_RESERVATION: ${{ needs.plan.outputs.reservation }}
        run: python3 scripts/ci/server-release.py reserve
  signed-build:
    needs: [plan, reserve]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.ready == 'true' && (needs.reserve.result == 'success' || needs.plan.outputs.publish == 'false') }}
    runs-on: xcode-27
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare platform tools
        run: scripts/ci/prepare-tools.sh
      - name: Validate reserved source before signing
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEINK_RELEASE_RESERVATION: ${{ needs.plan.outputs.reservation }}
          VOICEINK_RELEASE_TAG_OBJECT: ${{ needs.reserve.outputs.tag_object }}
          VOICEINK_RELEASE_METADATA: ${{ needs.plan.outputs.metadata }}
        run: python3 scripts/ci/server-release.py verify
      - name: Check signing configuration
        env:
          VOICEINK_P12_BASE64: ${{ secrets.VOICEINK_P12_BASE64 }}
          VOICEINK_P12_PASSWORD: ${{ secrets.VOICEINK_P12_PASSWORD }}
        run: |
          [[ -n "$VOICEINK_P12_BASE64" && -n "$VOICEINK_P12_PASSWORD" ]] || { echo 'Configure the two release signing secrets before running this workflow.' >&2; exit 1; }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache: false
      - name: Tests
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/*.yml
          Tools/AudioDuckingTests/run.sh
          Tools/PlusReleaseTests/run.sh
          Tools/AutomationTests/run.sh
          Tools/ReleaseInstallTests/test-bootstrap.sh
      - name: Prepare pinned Whisper
        run: scripts/ci/prepare-whisper.sh
      - name: Resolve pinned packages
        env:
          VOICEINK_DERIVED_DATA: ${{ runner.temp }}/voiceink-derived
        run: scripts/ci/resolve-packages.sh
      - name: Import signing identity
        env:
          VOICEINK_P12_BASE64: ${{ secrets.VOICEINK_P12_BASE64 }}
          VOICEINK_P12_PASSWORD: ${{ secrets.VOICEINK_P12_PASSWORD }}
        run: scripts/ci/signing.sh
      - name: Build, package and verify release
        env:
          GH_TOKEN: ${{ github.token }}
          VOICEINK_RELEASE_METADATA: ${{ needs.plan.outputs.metadata }}
          VOICEINK_SIGNING_IDENTITY: C5C6F16ED5A3D8B28CF3A4CA19638284E9190C6B
          VOICEINK_DERIVED_DATA: ${{ runner.temp }}/voiceink-derived
          VOICEINK_BUILD_OUTPUT: /private/tmp/voiceink-ci-release-app
        run: |
          scripts/build-app.sh release
          python3 scripts/plus-release.py package --app "$VOICEINK_BUILD_OUTPUT/VoiceInk.app" --output "$RUNNER_TEMP/release-assets"
          archive=$(find "$RUNNER_TEMP/release-assets" -maxdepth 1 -name '*.zip' -print)
          Tools/AutomationTests/test-signed-install.sh "$archive" "$RUNNER_TEMP/release-assets/release.json"
          Tools/PersonalInstallTests/test-real-bundle-rollback.sh "$VOICEINK_BUILD_OUTPUT/VoiceInk.app"
          cp scripts/install.sh "$RUNNER_TEMP/release-assets/install.sh"
          (cd "$RUNNER_TEMP/release-assets" && shasum -a 256 ./* > SHA256SUMS)
      - name: Remove signing identity
        if: always()
        run: scripts/ci/signing.sh cleanup
      - if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          retention-days: 1
          if-no-files-found: error
  publish:
    concurrency:
      group: voiceink-publish
      cancel-in-progress: false
    if: ${{ !cancelled() && needs.signed-build.result == 'success' && needs.plan.outputs.publish == 'true' }}
    needs: [plan, reserve, signed-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release-assets
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: legrch/VoiceInk
          TAG_NAME: ${{ needs.plan.outputs.tag }}
          RELEASE_SOURCE: ${{ needs.plan.outputs.source }}
          VOICEINK_RELEASE_RESERVATION: ${{ needs.plan.outputs.reservation }}
          VOICEINK_RELEASE_TAG_OBJECT: ${{ needs.reserve.outputs.tag_object }}
          VOICEINK_RELEASE_METADATA: ${{ needs.plan.outputs.metadata }}
        run: |
          python3 scripts/ci/server-release.py verify
          python3 scripts/ci/publish-release.py release-assets "$TAG_NAME" "$RELEASE_SOURCE"
